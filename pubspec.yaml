name: chubi_pocket
description: "chubiPocket — personal finance tracker."
publish_to: 'none'

# Versioning: matches the git tag of the release line (v0.1.0). Bump the
# +build number on every distributed build; bump the version itself only
# when the owner says so. Shown on the splash screen.
version: 0.3.1-3+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — Bloc + Cubit + Repository pattern (locked)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Fonts
  google_fonts: ^6.2.1

  # i18n / formatting
  intl: any

  # Persistence
  shared_preferences: ^2.3.3      # non-sensitive prefs (theme, locale, font)
  flutter_secure_storage: ^9.2.2  # auth tokens (mobile keystore; web falls back)

  # Android: opt in to highest available display refresh rate (120Hz on capable devices).
  # No-op on web / iOS / desktop.
  flutter_displaymode: ^0.6.0
  path_provider: ^2.1.5

  # App version at runtime — shown on the splash screen.
  package_info_plus: ^8.1.2
  flutter_colorpicker: ^1.1.0

  # Slip import (0.3.1, Android only): pick slips from the gallery and read
  # their QR on the phone. ML Kit has no web build — the import UI is hidden
  # on web (SlipQrReader.isSupported).
  image_picker: ^1.2.4
  google_mlkit_barcode_scanning: ^0.16.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  flutter_lints: ^6.0.0

  # Launcher-icon generator. Reads the config block below and writes
  # platform-specific icon assets under android/app/src/main/res/mipmap-*
  # (and iOS/web equivalents when enabled). Run with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

  # Native launch screen (before Flutter draws). Reads the
  # flutter_native_splash block below and writes android/app/src/main/res
  # drawables + styles (pre-12 and values-v31). Run with:
  #   dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.8

# Source: assets/icon/logo.png — a 1024×1024 PNG with the brand mark.
# Android-only for Phase 1 (iOS not planned through Phase 3).
#
# Adaptive icon: foreground reuses the same PNG and the OS mask shapes
# it (circle/squircle/rounded-square per the launcher). The brand teal
# `#22B2A6` is the background so masking shows that color around the
# rounded artwork.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#22B2A6"
  adaptive_icon_foreground: "assets/icon/logo.png"

# Native launch screen — hands off to SplashPage with no jump: the same
# background (the default mint theme's light / dark `background`) and the
# logo centred at the same 128dp that [BrandLogo] draws there.
#
# logo.png has black corners (no alpha), so assets/splash/ holds
# rounded-square cut-outs with real transparency (same 24% radius as
# BrandLogo's clip), made from logo.png with .NET System.Drawing:
# - splash_logo.png: 512×512 — pre-Android-12, read as 4x → 128dp.
# - splash_logo_android12.png: the same 512px logo centred on a
#   transparent 1152×1152 canvas (= 288dp). Android 12+ masks the splash
#   icon to a 192dp circle; the padding keeps the whole rounded square
#   inside it.
flutter_native_splash:
  color: "#F7F8FA"
  color_dark: "#0F1114"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo.png
  android_gravity: center
  android_12:
    color: "#F7F8FA"
    color_dark: "#0F1114"
    image: assets/splash/splash_logo_android12.png
    image_dark: assets/splash/splash_logo_android12.png
  ios: false
  web: false

flutter:
  uses-material-design: true
  generate: true
  # When the first avatar PNG is added (see assets/avatars/README.md),
  # uncomment the line below to register the folder. Leave it commented
  # while the folder has no PNGs — Flutter rejects empty asset entries.
  assets:
    - assets/icon/  # logo on the login / register brand header
    # - assets/avatars/
